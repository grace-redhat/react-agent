apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp-server
  namespace: mcp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mcp-server
  template:
    metadata:
      labels:
        app: github-mcp-server
    spec:
      containers:
      - name: github-mcp-server
        image: ghcr.io/github/github-mcp-server:latest
        args: ["http", "--port=9090"]
        ports:
        - containerPort: 9090
        env:
        - name: GITHUB_PERSONAL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-mcp-token
              key: GITHUB_TOKEN
        resources: 
          requests:
            cpu: 100m
            memory: 128Mi
---         
apiVersion: v1
kind: Service
metadata:
  name: github-mcp-server
  namespace: mcp-system
spec:
  selector:
    app: github-mcp-server
  ports: 
  - port: 9090
    targetPort: 9090