[project]
name = "react_agent"
version = "0.1.0"
description = "A template for a LangGraph LLM app deployable on RHOAI Cloud as an ai_service. This particular example focues on an AutoX chatbot enhanced with external tools (function calling)."
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.12,<=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langgraph-prebuilt>=1.0.8",
    "langchain-mcp-adapters>=0.1.0",
    "mcp-server-fetch>=0.6.0",
    "openai>=2.24.0",
    "python-dotenv>=1.2.2",
    "setuptools>=80.9.0,<83.0.0",
    "starlette>=1.0.1",
    "protobuf<7",
]

[project.optional-dependencies]
auth = [
    "agent-auth",
]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
]
eval = [
    "unitxt>=1.24.0",
    "datasets==3.6.0",
    "nltk>=3.9.1",
    "rouge-score>=0.1.2",
]
tracing = [
    "mlflow[kubernetes]==3.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
agent-auth = { path = "./components/auth" }

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
